# Continuous integration: every push and pull request is checked automatically.
# - Backend: install, generate the Prisma client, type-check and build, run the unit tests,
#   then apply every database migration to a fresh PostgreSQL to prove they work.
# - Frontend: install and build the Next.js app (this also type-checks it).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghg-platform/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghg_admin
          POSTGRES_PASSWORD: ghg_ci_password
          POSTGRES_DB: ghg_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghg_admin -d ghg_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ghg_admin:ghg_ci_password@localhost:5432/ghg_platform?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ghg-platform/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test -- --ci
      - name: Apply all migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Seed reference data
        run: npx prisma db seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghg-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ghg-platform/frontend/package-lock.json
      - run: npm ci
      - name: Build (includes type-check)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

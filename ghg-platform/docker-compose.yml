services:
  postgres:
    image: postgres:16-alpine
    container_name: ghg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghg_admin
      POSTGRES_PASSWORD: ghg_dev_password
      POSTGRES_DB: ghg_platform
    ports:
      - "15432:5432"
    volumes:
      - ghg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghg_admin -d ghg_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    container_name: ghg_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ghg_minio_admin
      MINIO_ROOT_PASSWORD: ghg_minio_dev_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    volumes:
      - ghg_minio_data:/data

  # ---- Application (optional) ----
  # The two services below run the API and web app inside Docker too. They only start when the
  # "app" profile is requested, so `docker compose up -d` still starts just the database, Redis and MinIO:
  #   docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: ./backend
    container_name: ghg_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ghg_admin:ghg_dev_password@postgres:5432/ghg_platform?schema=public
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-before-sharing-this-server}
      JWT_EXPIRES_IN: 8h
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ghg-attachments
      S3_ACCESS_KEY_ID: ghg_minio_admin
      S3_SECRET_ACCESS_KEY: ghg_minio_dev_password
      S3_PUBLIC_URL_BASE: http://localhost:9000/ghg-attachments
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: ghg_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ghg_postgres_data:
    name: ghg-platform_ghg_postgres_data_v2
  ghg_minio_data:
